name: Publish website source
on:
  push:
    branches:
      - main
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Import Kokeb website
        run: |
          curl -fsSL https://kokeb-excellence-language.whet4f.chatgpt.site/kokeb-source.zip -o /tmp/kokeb-source.zip
          unzip -q /tmp/kokeb-source.zip -d /tmp/kokeb-source
          cp -a /tmp/kokeb-source/kokeb-excellence-language/. .
          rm -f .github/workflows/import.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Publish Kokeb Excellence website"
          git push
